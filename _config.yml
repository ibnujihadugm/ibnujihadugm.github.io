title: "Ibnu Jihad - Persoal Site"
description: "Research, Course Materials, and more..."
url: "https://ibnujihadugm.github.io"

# Configure the Remote Theme
remote_theme: "mmistakes/minimal-mistakes"
plugins:
  - jekyll-include-cache

# Enable MathJax for LaTeX equations
markdown: kramdown
mathjax: true

# Set the default page layout
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

#Author Details      
author:
  name: "Ibnu Jihad, Ph.D."
  avatar: "/images/profile.JPG"
  bio: "Lecturer and Computational Physics Researcher at Universitas Gadjah Mada."
  location: "Yogyakarta, Indonesia"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ibnujihadugm"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=CnblH-wAAAAJ&hl=en"



